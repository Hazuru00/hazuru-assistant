services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    network_mode: host
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./src:/app/src
      - ./frontend:/app/frontend
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./backups:/app/backups

  watch:
    build: .
    env_file: .env
    restart: unless-stopped
    profiles:
      - dev
    network_mode: host
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./src:/app/src
      - ./frontend:/app/frontend
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./backups:/app/backups
    command: npx nodemon src/index.js
